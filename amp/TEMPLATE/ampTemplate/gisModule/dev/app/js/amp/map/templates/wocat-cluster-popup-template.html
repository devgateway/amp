<div class="cluster-popup">
    <h5><%= obj.properties.admName%> <span data-i18n="amp.gis:popup-word-has">has</span> <%= obj.properties.wocatActivities.length %> <span data-i18n="amp.gis:popup-word-projects">projects</span></h5>

    <ul class="nav nav-tabs" role="tablist">
        <li class="active"><a href="#projects-pane" role="tab" data-toggle="tab" data-i18n="amp.gis:activities-projectlist">Project List</a></li>

    </ul>

    <!-- Tab panes -->
    <div class="tab-content">

        <div class="tab-pane active" id="projects-pane">
            <!-- this template is for adm clusters -->
            <div class="scroll-container">
                <table class="table table-striped table-condensed">
                    <thead>
                    <tr>
                        <th data-i18n="amp.gis:activities-project-title">Title</th>
                        <th data-i18n="amp.gis:activities-project-title">Description</th>
                        <th data-i18n="amp.gis:activities-project-title">Country</th>
                        <th data-i18n="amp.gis:activities-project-title">Type</th>

                    </tr>
                    </thead>
                    <tbody class="project-list">
                    </tbody>
                </table>
                <img class="loading" src="img/loading-icon.gif" />
            </div>
            <div class="btn btn-sm btn-info load-more"><span data-i18n="amp.gis:popup-loadmore">load more</span>...</div>
        </div>


    </div>
</div>
