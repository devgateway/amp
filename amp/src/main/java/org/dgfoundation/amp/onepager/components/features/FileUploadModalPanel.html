<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <title>File Upload Modal</title>
</head>
<body>
<wicket:panel>
    <form wicket:id="uploadForm">
        <div wicket:id="fileUploadField"></div>
        <div>
            <button wicket:id="uploadButton" type="button">Upload</button>
        </div>
    </form>
</wicket:panel>
</body>
</html>
