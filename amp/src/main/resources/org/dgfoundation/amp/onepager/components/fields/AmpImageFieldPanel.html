<wicket:extend>
    <style>
        #imageUploadContainer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            max-width: 100%;
        }

        /* Label styling - styled as a button */
        #uploadLabel {
            display: inline-block;
            padding: 6px 16px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #4CAF50;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        #uploadLabel:hover {
            background: #f0fff0;
        }

        /* Hide native file input */
        #projectThumbnailInput {
            display: none;
        }

        #projectThumbnailInputPreviewContainer {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #projectThumbnailInputPreview {
            border: 1px solid #ddd;
            border-radius: 4px;
            object-fit: cover;
            background: #f5f5f5;
            width: 20px;
            height: 20px;
            display: none;
            cursor: zoom-in;
        }

        #projectThumbnailInputPreview:hover {
            transform: scale(1.05);
            transition: transform 0.2s ease;
        }

        #projectThumbnailInputNoImage {
            font-size: 14px;
            color: #333;
        }

        #projectThumbnailInputError {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 4px;
            min-height: 18px;
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
    </style>

    <div id="imageUploadContainer">
        <label wicket:id="label" for="projectThumbnailInput" id="uploadLabel">Choose Image</label>
        <input type="file" wicket:id="fileUpload" id="projectThumbnailInput" accept=".png,.jpg,.jpeg"/>
        <div id="projectThumbnailInputPreviewContainer">
            <img wicket:id="previewImage" id="projectThumbnailInputPreview" />
            <span wicket:id="noImage" id="projectThumbnailInputNoImage">No image chosen</span>
        </div>
        <div id="projectThumbnailInputError"></div>
    </div>

    <div id="imagePreviewModal" class="image-modal">
        <img id="fullSizePreviewImage" />
    </div>
</wicket:extend>
