version: "3.8"

# AMP stack — private IP access, no domain required
# Requires: Docker >= 20.10, Docker Compose >= 2.0
#
# Images are built by GitHub Actions and pushed to ECR, tagged with the branch name.
# Set AMP_IMAGE (ECR repo URL) and AMP_TAG (branch/tag) in .env before running setup.sh.
#
# TruBudget is installed separately via its official scripts (see setup.sh).
#
# Access (replace 192.168.x.x with your server's private IP):
#   http://192.168.x.x:8080      → AMP
#   http://192.168.x.x:3000      → TruBudget UI      (managed by TruBudget scripts)
#   http://192.168.x.x:8081/api  → TruBudget API     (managed by TruBudget scripts)
#
# PostgreSQL is NOT exposed to the host — internal only.

services:

  # ─── PostgreSQL for AMP ───────────────────────────────────────────────────
  db:
    image: postgres:14-alpine
    container_name: amp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AMP_DB_NAME:-amp}
      POSTGRES_USER: ${AMP_DB_USER:-amp}
      POSTGRES_PASSWORD: ${AMP_DB_PASSWORD:-amp}
    volumes:
      - amp_db_data:/var/lib/postgresql/data
    networks:
      - amp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AMP_DB_USER:-amp} -d ${AMP_DB_NAME:-amp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── AMP (Tomcat WAR) ──────────────────────────────────────────────────────
  amp:
    # Image is built by GitHub Actions (.github/workflows/build-push-ecr.yml)
    # and pushed to ECR tagged with the branch name.
    # AMP_IMAGE → ECR repo URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/amp/webapp)
    # AMP_TAG   → branch / release tag (e.g. develop, main, v1.2.0)
    image: ${AMP_IMAGE}:${AMP_TAG}
    # Never let Compose pull this image — setup.sh handles ECR auth + pull.
    # Run setup.sh (not docker compose up directly) to deploy or update.
    pull_policy: never
    container_name: amp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_HOST: db
      JDBC_PORT: 5432
      JDBC_DB: ${AMP_DB_NAME:-amp}
      JDBC_USER: ${AMP_DB_USER:-amp}
      JDBC_PASSWORD: ${AMP_DB_PASSWORD:-amp}
      # TruBudget API runs on the host via its own compose stack.
      # host.docker.internal resolves to the host machine from inside a container.
      TRUBUDGET_BASE_URL: ${TRUBUDGET_BASE_URL:-http://host.docker.internal:8081/}
      TRUBUDGET_ENABLED: ${TRUBUDGET_ENABLED:-false}
    ports:
      - "${AMP_PORT:-8080}:8080"
    extra_hosts:
      # Allows AMP container to reach services on the host (including TruBudget)
      - "host.docker.internal:host-gateway"
    networks:
      - amp-net
    volumes:
      - amp_uploads:/opt/amp/uploads
      - /var/log/amp:/usr/local/tomcat/logs

volumes:
  amp_db_data:
  amp_uploads:

networks:
  amp-net:
    driver: bridge
